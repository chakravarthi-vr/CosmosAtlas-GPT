      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 1. Install Gradle 8.10.2 on the runner
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # 2. Automatically generate gradle-wrapper.jar if not committed
      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar not found, generating wrapper..."
            gradle wrapper --gradle-version 8.10.2
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew test --continue --stacktrace
